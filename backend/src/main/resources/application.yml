spring:
  application:
    name: tabletop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tabletop}
    username: ${DB_USER:tabletop}
    password: ${DB_PASSWORD:tabletop}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

tabletop:
  jwt:
    secret: ${JWT_SECRET:dev-secret-dev-secret-dev-secret-dev-secret}
    ttl-minutes: 1440

management:
  endpoints:
    web:
      exposure:
        include: health
